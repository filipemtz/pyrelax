[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrelax"
version = "0.1.0"
description = "A relational algebra interpreter in python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Filipe Mutz", email = "filipemtz@gmail.com"}
]

dependencies = [
    "lark>=1.1",
    "duckdb>=0.10",
    "pandas>=1.5",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/filipemtz/pyrelax"
Repository = "https://github.com/filipemtz/pyrelax"

[project.scripts]
pyrelax_demo = "pyrelax.apps.run_demo:main"